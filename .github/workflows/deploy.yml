name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-backend:
    name: Deploy Backend to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build backend
        run: pnpm --dir backend build

      - name: Create deployment package
        run: |
          cd backend
          tar -czf ../backend-deploy.tar.gz \
            --exclude='node_modules' \
            --exclude='.cache' \
            --exclude='.tmp' \
            --exclude='*.log' \
            .

      - name: Copy files to VPS via SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: 'backend-deploy.tar.gz'
          target: '/tmp/'

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            # Define deployment directory
            DEPLOY_DIR="/var/www/chefly-backend"
            
            # Create directory if it doesn't exist
            mkdir -p $DEPLOY_DIR
            
            # Extract new files
            cd $DEPLOY_DIR
            tar -xzf /tmp/backend-deploy.tar.gz
            rm /tmp/backend-deploy.tar.gz
            
            # Install pnpm if not installed
            if ! command -v pnpm &> /dev/null; then
              npm install -g pnpm
            fi
            
            # Install dependencies
            pnpm install --prod --frozen-lockfile
            
            # Restart the application (using PM2)
            if command -v pm2 &> /dev/null; then
              pm2 restart chefly-backend || pm2 start npm --name "chefly-backend" -- start
            else
              echo "PM2 not installed. Please install PM2 for process management."
            fi
            
            echo "Backend deployment completed successfully!"
